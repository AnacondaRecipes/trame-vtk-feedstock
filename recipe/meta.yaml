{% set name = "trame-vtk" %}
{% set version = "2.11.8" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: bef4a35d86d57bf9b4af44dda8f361f917b141e4f624c9ab7278b6c48d171e74

build:
  number: 0
  skip: true # [py<39]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - trame-client >=3.4,<4

test:
  imports:
    - trame
    - trame.modules
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://pypi.org/project/trame-vtk/
  summary: VTK widgets for trame
  description: |
    VTK integration in trame allows you to create rich visualization and data processing
    applications by leveraging the Python wrapping of the VTK library. Several components are
    available so you can leverage VTK either for its data processing and/or rendering. trame lets you choose
    if you want to leverage Remote Rendering or if the client should do the rendering by
    leveraging vtk.js under the hood.
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  dev_url: https://github.com/Kitware/trame-vtk
  doc_url: https://github.com/Kitware/trame-vtk/blob/master/README.rst

extra:
  recipe-maintainers:
    - larsoner
    - jourdain
    - psavery
    - kwrobot
